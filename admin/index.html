<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin | Abyasa Portfolio</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <!-- Header: logo, tautan ke website, tombol keluar -->
  <header class="topbar">
    <a class="brand" href="/admin/" aria-label="Admin Abyasa">
      <span class="brand-mark">A</span><b>Abyasa.</b><span class="brand-tag">Admin</span>
    </a>
    <div class="top-actions">
      <a class="btn btn-soft" id="siteLink" href="http://localhost:3000" target="_blank" rel="noreferrer">Lihat website ↗</a>
      <button class="btn btn-dark" id="logoutBtn" type="button" hidden>Keluar</button>
    </div>
  </header>

  <main>
    <!-- ===== Tampilan login ===== -->
    <section id="loginView" class="login" aria-labelledby="loginTitle">
      <form id="loginForm" class="card login-card" novalidate>
        <h1 id="loginTitle">Masuk admin</h1>
        <p class="muted">Kelola project yang tampil di portfolio.</p>

        <label class="field">
          <span>Username</span>
          <input id="username" name="username" autocomplete="username" required />
        </label>
        <label class="field">
          <span>Password</span>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </label>

        <p class="form-error" id="loginError" role="alert" hidden></p>
        <button class="btn btn-primary btn-block" id="loginBtn" type="submit">Masuk</button>
      </form>
    </section>

    <!-- ===== Dashboard ===== -->
    <section id="dashView" hidden>
      <div class="tabs" id="tabs" role="tablist" aria-label="Jenis konten"></div>

      <div class="dash-head">
        <div>
          <h1 id="dashTitle">Featured Projects</h1>
          <p class="muted" id="summary">Memuat…</p>
          <p class="muted tab-note" id="tabNote"></p>
        </div>
        <button class="btn btn-primary" id="newBtn" type="button">+ Project baru</button>
      </div>

      <ul class="project-list" id="list" aria-live="polite"></ul>
      <p class="empty" id="empty" hidden></p>
    </section>
  </main>

  <!-- ===== Editor (dialog bawaan browser: Esc menutup, fokus terkunci) ===== -->
  <dialog id="editor" aria-labelledby="editorTitle">
    <form id="editorForm" method="dialog" novalidate>
      <div class="editor-head">
        <h2 id="editorTitle">Baru</h2>
        <button class="icon-btn" type="button" data-close aria-label="Tutup">✕</button>
      </div>

      <div class="editor-body">
        <!-- Isian dibuat oleh js/editor.js dari definisi di js/resources.js -->
        <div class="editor-fields" id="editorFields"></div>

        <aside class="editor-preview" aria-label="Pratinjau">
          <p class="preview-label">Pratinjau</p>
          <div id="previewRoot"></div>
          <p class="muted preview-note" id="previewNote"></p>
        </aside>
      </div>

      <p class="form-error editor-error" id="editorError" role="alert" hidden></p>
      <div class="editor-foot">
        <button class="btn btn-soft" type="button" data-close>Batal</button>
        <button class="btn btn-primary" id="saveBtn" type="submit">Simpan</button>
      </div>
    </form>
  </dialog>

  <!-- ===== Konfirmasi hapus ===== -->
  <dialog id="confirm" aria-labelledby="confirmTitle">
    <form method="dialog" class="confirm">
      <h2 id="confirmTitle">Hapus data?</h2>
      <p class="muted" id="confirmText"></p>
      <div class="editor-foot">
        <button class="btn btn-soft" value="cancel">Batal</button>
        <button class="btn btn-danger" value="ok" id="confirmOk">Ya, hapus</button>
      </div>
    </form>
  </dialog>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <script type="module" src="/admin/js/app.js"></script>
</body>
</html>
